<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://md2.sujx.net/">
  <link rel="canonical" href="https://md2.sujx.net/">
  <title>Markdown 公文转换器 - 靖轩</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      background: #F6F6F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #333;
    }

    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      line-height: 1.7;
      color: #666;
      margin-bottom: 20px;
    }

    a.btn {
      display: inline-block;
      padding: 10px 22px;
      background: #4A90E2;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      transition: background 0.2s;
    }

    a.btn:hover {
      background: #357ABD;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Markdown 公文转换器</h1>
      <p>正在为你跳转到工具页面，若浏览器未自动跳转，请点击下方按钮。</p>
      <a class="btn" href="https://md2.sujx.net/" rel="noopener">立即前往</a>
    </div>
  </div>
  <script>
    // 保险：meta refresh 未生效时用 JS 跳转
    setTimeout(function () {
      window.location.replace('https://md2.sujx.net/');
    }, 50);
  </script>
</body>

</html>
